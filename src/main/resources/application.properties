# ============================================================================
# Configuração da aplicação Trabalho_VVS
# ============================================================================

quarkus.application.name=Trabalho_VVS
quarkus.http.port=8080

# ----------------------------------------------------------------------------
# Perfil de produção/desenvolvimento: MySQL (mesmo banco do projeto original)
# Os valores podem ser sobrescritos por variáveis de ambiente:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# ----------------------------------------------------------------------------
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/trab2jpa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Mantém os nomes de tabelas/colunas exatamente como declarados nas entidades.
# Isso torna o esquema previsível para o script de dados (import-dev.sql) e para
# os comandos de limpeza usados nos testes.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ----------------------------------------------------------------------------
# Perfil de desenvolvimento: H2 em memória para não exigir MySQL local.
# Dados de exemplo são carregados por br.edu.ifrs.vvs.config.InicializadorDados.
# ----------------------------------------------------------------------------
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:clinica-dev;DB_CLOSE_DELAY=-1;MODE=MySQL
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.sql-load-script=import-dev.sql

# ----------------------------------------------------------------------------
# Perfil de teste: H2 em memória isolado, recriado a cada execução.
# ----------------------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:clinica-test;DB_CLOSE_DELAY=-1;MODE=MySQL
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.log.level=WARN

# ----------------------------------------------------------------------------
# Log da aplicação
# ----------------------------------------------------------------------------
quarkus.log.console.level=INFO

