# ============================================================================
# Configuração aplicada EXCLUSIVAMENTE durante os testes.
# Este arquivo, em src/test/resources, tem precedência sobre o
# application.properties de produção, garantindo que nenhum teste
# utilize o banco MySQL real.
# ============================================================================

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:clinica-test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Nomes físicos iguais aos declarados nas entidades: permite limpeza determinística
# das tabelas entre os testes (ver classe BaseComponenteTest).
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

quarkus.log.level=WARN

# ----------------------------------------------------------------------------
# Cobertura de código (extensão quarkus-jacoco)
# A extensão é dependência de teste, portanto sua configuração pertence a este
# arquivo. O caminho é absoluto (baseado no diretório de trabalho) para que as
# execuções do Surefire (testes unitários/componente) e do Failsafe (sistema)
# gravem no MESMO arquivo; com reuse-data-file=true os dados são acumulados e a
# cobertura final reflete toda a suíte.
# ----------------------------------------------------------------------------
quarkus.jacoco.report=true
quarkus.jacoco.data-file=${user.dir}/jacoco-quarkus.exec
quarkus.jacoco.reuse-data-file=true
quarkus.jacoco.report-location=${user.dir}/target/jacoco-report
